name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Explicit versions, not "3.x": a new Python can break Ansible on release
    # day, and that must not turn main red. Keep this in step with
    # `requires-python` and `env_list` in pyproject.toml.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      # fetch-depth: 0 so setuptools-scm sees the tags it derives the
      # version from; the default depth-1 clone has none.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: pip install tox

      # The checks themselves live in [tool.tox] in pyproject.toml, so local
      # runs and CI share one list.
      - name: Run checks
        run: tox -e "${{ matrix.python-version }}" --skip-missing-interpreters false
