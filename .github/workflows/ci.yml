name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Deliberately one version, not a matrix: depp is an operator tool run
      # from a single control node, not a library imported into other people's
      # projects, so the newest stable Python is the only version that matters.
      # "3.x" is setup-python's x-range for the latest stable release, so CI
      # follows each October release without a repo change — at the cost of
      # possibly turning red on release day. The `requires-python = ">=3.12"`
      # floor in pyproject.toml is therefore not exercised here.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

      # The playbooks are otherwise only exercised against a real host. A
      # syntax error in reset.yml — which deletes volume contents — would
      # otherwise ship undetected.
      - name: Check playbook syntax
        env:
          ANSIBLE_CONFIG: depp/ansible_common/ansible.cfg
        run: |
          for playbook in depp/ansible_*/*.yml; do
            echo "::group::$playbook"
            ansible-playbook --syntax-check "$playbook"
            echo "::endgroup::"
          done

      - name: Lint playbooks
        run: ansible-lint depp/
