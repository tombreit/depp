# Multi-document manifest read by `podman kube play`:
#   1. a ConfigMap carrying the Caddyfile (mounted into the caddy container)
#   2. the Pod itself
#
# depp ALSO passes a second ConfigMap ("wagtail-demo-config", rendered from
# deploy/.env) via `--configmap`; containers receive those vars through envFrom.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: caddy-config
data:
  Caddyfile: |
    :80 {
        handle_path /static/* {
            root * /srv/static
            file_server
        }
        handle_path /media/* {
            root * /srv/media
            file_server
        }
        reverse_proxy 127.0.0.1:8000
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: wagtail-demo
spec:
  restartPolicy: Always

  # Static files are collected into the image at build time (see Containerfile).
  # This initContainer just copies them into the shared `static` volume so the
  # Caddy sidecar can serve them — a fast file copy with no Django startup, env,
  # or database, unlike running `collectstatic` here on every pod start.
  initContainers:
    - name: copy-static
      image: localhost/wagtail-demo:latest
      command: ["sh", "-c", "cp -a /app/staticfiles/. /srv/static/"]
      volumeMounts:
        - name: static
          mountPath: /srv/static

  containers:
    # Reverse proxy on :80 (the port depp publishes to the host). Serves
    # /static and /media itself; proxies everything else to gunicorn.
    - name: caddy
      image: docker.io/library/caddy:2-alpine
      volumeMounts:
        - name: caddy-config
          mountPath: /etc/caddy
        - name: static
          mountPath: /srv/static
        - name: media
          mountPath: /srv/media

    # The Wagtail app (gunicorn :8000). Named "app" so the pod container is
    # "wagtail-demo-app" — which is what `depp exec` targets.
    - name: app
      image: localhost/wagtail-demo:latest
      envFrom:
        - configMapRef:
            name: wagtail-demo-config
      volumeMounts:
        - name: media
          mountPath: /app/data/media

    - name: db
      image: docker.io/library/postgres:18-alpine
      envFrom:
        - configMapRef:
            name: wagtail-demo-config
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data

  volumes:
    # Caddy's config, from the ConfigMap above.
    - name: caddy-config
      configMap:
        name: caddy-config
        items:
          - key: Caddyfile
            path: Caddyfile
    # Ephemeral: repopulated from the image by the copy-static initContainer
    # every deploy — not a PVC, so not backed up.
    - name: static
      emptyDir: {}
    # Persistent volumes. depp pre-creates these (it reads the claimNames);
    # podman kube play would otherwise auto-create them on first run.
    - name: media
      persistentVolumeClaim:
        claimName: wagtail-demo-media
    - name: pgdata
      persistentVolumeClaim:
        claimName: wagtail-demo-pgdata
