[build-system]
requires = ["setuptools>=80", "setuptools-scm>=10"]
build-backend = "setuptools.build_meta"

[project]
name = "depp"
description = "Opinionated rootless Podman provisioning and deployment."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
dynamic = ["version"]
# Both ends come from the `ansible` dependency below: Ansible 14 requires >=3.12
# and crashes on startup on 3.15, though its metadata does not say so.
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Thomas Breitner", email = "mail@thms.de" },
]
keywords = ["ansible", "podman", "deployment", "provisioning", "rootless", "systemd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # The community package includes ansible-core and the curated collections
    # used by depp, avoiding network-dependent Galaxy installs at command time.
    "ansible>=14,<15",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    # Arrives transitively via ansible; declared so the template tests do not
    # depend on ansible's dependency tree staying the same.
    "jinja2",
    "ruff",
    "ansible-lint",
    "pre-commit",
    # 4.21 added the [tool.tox] table used below.
    "tox>=4.21",
]

[project.urls]
Homepage = "https://github.com/tombreit/depp"
Repository = "https://github.com/tombreit/depp"
Issues = "https://github.com/tombreit/depp/issues"

[project.scripts]
depp = "depp:main"

[tool.setuptools_scm]
# Calendar versioning: depp is an operator tool, not a library with an API
# compatibility contract, so the release date says more than a semver triple.
# The default local_scheme appends +g<commit> (and .d<date> when built from a
# dirty tree), which is what `depp --version` reports.
#
# Deliberately no fallback_version: a placeholder would make a build with no
# git history silently report a version that lies. Every supported install path
# (see the README) builds from a real clone, so a build without git history is
# a mistake and must fail loudly rather than ship a wrong version.
version_scheme = "calver-by-date"

[tool.setuptools.packages.find]
where = ["."]
include = ["depp*"]

[tool.setuptools.package-data]
"*" = ["*.yml", "*.j2", "*.cfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.tox]
env_list = ["3.12", "3.13", "3.14"]
# tox does not install Python itself. Locally, run what is available; CI turns
# this off, so a job there cannot pass by skipping its only interpreter.
skip_missing_interpreters = true

[tool.tox.env_run_base]
description = "Run every check on {env_name}"
extras = ["dev"]
# ansible-lint does not go through depp's runner, and Ansible searches
# ~/.ansible/collections first, so a copy there would shadow the bundled
# collections that CI tests.
set_env = { ANSIBLE_HOME = "{env_tmp_dir}/ansible" }
commands = [
    ["ruff", "check", "."],
    ["ruff", "format", "--check", "."],
    ["pytest", "-q"],
    ["ansible-lint"],
]

[tool.ruff]
line-length = 88
target-version = "py312"
# The bundled demo project is third-party-shaped Django code, not depp's own.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
