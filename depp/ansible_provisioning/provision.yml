# Host provisioning playbook for rootless-podman deployments.
# This playbook runs with elevated privileges (become: true) to:
#   - Install and configure podman for rootless operation
#   - Create a dedicated deployment user ([host] user, default: the fqdn)
#   - Create Apache reverse proxy configuration for the host
#   - Apache reverse proxies to the pod's published loopback port
#
# SSH key setup (handled in pre_tasks):
#   - Ensures ~/.ssh/id_ed25519.depp exists locally (generated if missing)
#   - Authorizes that key for the new deploy user on the remote host
#
# Variables:
#   deploy_user      — inventory host var from [host] user (the CLI always
#                      sets it; the default() below only covers ad-hoc runs)
#   deploy_user_name — the resolved account name used by every task
#   depp_ssh_key     — path to the dedicated depp SSH private key
#   vhost_extra_src  — extra var set by the CLI only when the project ships
#                      deploy/vhost.conf: its local path
#

- name: Prepare Host for Rootless Podman Deployment
  hosts: all
  gather_facts: true
  become: true

  vars:
    ansible_python_interpreter: auto_silent

    # Deployment user: [host] user, or the fqdn itself. Play vars outrank
    # inventory host vars, so this must not share a name with the host var.
    deploy_user_name: "{{ deploy_user | default(inventory_hostname) }}"
    deploy_user_home: "/home/{{ deploy_user_name }}"


    # Dedicated SSH key for all depp deployments
    depp_ssh_key: "~/.ssh/id_ed25519.depp"

    # Apache configuration
    apache_conf_path: "/etc/apache2/sites-available/{{ inventory_hostname }}.conf"
    apache_enabled_path: "/etc/apache2/sites-enabled/{{ inventory_hostname }}.conf"
    # The project's deploy/vhost.conf, included from inside the :443 vhost.
    # Mirrored by apache_snippet_path() in depp/cli.py for the summary.
    apache_extra_dir: /etc/apache2/depp
    apache_extra_conf_path: "{{ apache_extra_dir }}/{{ inventory_hostname }}.vhost.conf"

  pre_tasks:
    - name: Ensure dedicated depp SSH keypair exists locally
      community.crypto.openssh_keypair:
        path: "{{ depp_ssh_key }}"
        type: ed25519
        comment: "depp deployment key"
        state: present
      delegate_to: localhost
      become: false
      register: depp_keypair

  tasks:
    ###################################################################
    # Podman Installation
    ###################################################################

    - name: Ensure Podman is installed
      ansible.builtin.apt:
        name:
          - podman
        state: present
        update_cache: true

    ###################################################################
    # User creation
    ###################################################################

    # The vhost depp generated on an earlier run records the deployment user
    # (Define DEPP_USER). A run that now names a different [host] user is
    # refused instead of quietly creating a second user next to the one that
    # owns the running pod and its volumes.
    - name: Check for a vhost from an earlier provisioning run
      ansible.builtin.stat:
        path: "{{ apache_conf_path }}"
      register: existing_vhost

    - name: Read the recorded deployment user from that vhost
      ansible.builtin.slurp:
        src: "{{ apache_conf_path }}"
      register: existing_vhost_content
      when: existing_vhost.stat.exists

    - name: Refuse to provision the same host under a different deployment user
      ansible.builtin.fail:
        msg: >-
          {{ inventory_hostname }} was provisioned with deployment user
          '{{ recorded_user }}' but depp.toml now names '{{ deploy_user_name }}'.
          depp will not create a second user for one host: the running pod,
          its volumes and its systemd units live in the first user's home.
          Restore [host] user (or remove it if the recorded name is the fqdn),
          or migrate by hand — see "Changing the deployment user" in the README.
      vars:
        recorded_user: >-
          {{ existing_vhost_content.content | b64decode
             | regex_findall('^Define DEPP_USER (\S+)$', multiline=True)
             | first | default('', true) }}
      when:
        - existing_vhost.stat.exists
        - recorded_user | length > 0
        - recorded_user != deploy_user_name

    # A vhost written by 0.0.1 has no Define DEPP_USER line, and a host with
    # no vhost at all may still carry a user: both cases used the fqdn.
    - name: Look for a legacy deployment user named after the fqdn
      ansible.builtin.getent:
        database: passwd
        key: "{{ inventory_hostname }}"
        fail_key: false
      when: deploy_user_name != inventory_hostname

    - name: Refuse to add a second user next to a legacy fqdn-named one
      ansible.builtin.fail:
        msg: >-
          user '{{ inventory_hostname }}' already exists on this host, which
          means it was provisioned by an earlier depp with the default
          deployment user. Remove [host] user from depp.toml, or migrate the
          account by hand — see "Changing the deployment user" in the README.
      when:
        - deploy_user_name != inventory_hostname
        - ansible_facts.getent_passwd[inventory_hostname] is not none

    - name: Ensure deployment user exists
      ansible.builtin.user:
        name: "{{ deploy_user_name }}"
        comment: "Deployment user for {{ inventory_hostname }}"
        shell: "/bin/bash"
        home: "{{ deploy_user_home }}"
        create_home: true
        system: false
        password: "!"
        password_lock: true # Disable password login
        state: present
      register: user_creation

    - name: Display user creation status
      ansible.builtin.debug:
        msg: "User {{ deploy_user_name }} {{ 'created' if user_creation.changed else 'already exists' }}"

    - name: Authorize depp SSH key for deployment user
      ansible.posix.authorized_key:
        user: "{{ deploy_user_name }}"
        key: "{{ depp_keypair.public_key }}"
        state: present
      when: not ansible_check_mode

    # enable lingering so that user-scoped systemd services can start without an active login
    - name: Enable lingering for deployment user
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ deploy_user_name }}"
        creates: "/var/lib/systemd/linger/{{ deploy_user_name }}"

    - name: Display configuration information
      ansible.builtin.debug:
        msg:
          - "Deployment user: {{ deploy_user_name }}"
          - "User home: {{ deploy_user_home }}"
          - "Loopback port: {{ host_loopback_port }} (Apache → 127.0.0.1:{{ host_loopback_port }})"

    ###################################################################
    # Apache reverse proxy configuration
    ###################################################################

    - name: Ensure Apache is installed
      ansible.builtin.apt:
        name:
          - apache2
        state: present
        update_cache: true

    - name: Ensure depp web asset directory exists
      ansible.builtin.file:
        path: /var/www/depp
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Served by Apache as ErrorDocument 503 while the pod restarts during a
    # deploy, so clients see a clean "back in a moment" page, not a raw 503.
    - name: Render deploy maintenance page
      ansible.builtin.template:
        src: "maintenance.html.j2"
        dest: /var/www/depp/maintenance.html
        owner: root
        group: root
        mode: "0644"

    # The vhost task below runs with no_log, which also censors the message of
    # an undefined-variable failure. Check the inputs where the error is legible.
    - name: Check the variables the vhost template needs
      ansible.builtin.assert:
        that:
          - app_name is defined
          - host_loopback_port is defined
          - acme_contact_email is defined
          - acme_certificate_authority is defined
        fail_msg: >-
          provisioning inventory is missing app_name, host_loopback_port,
          acme_contact_email or acme_certificate_authority
        quiet: true

    - name: Ensure the directory for project vhost snippets exists
      ansible.builtin.file:
        path: "{{ apache_extra_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Copied, not templated: the snippet is the operator's Apache config and
    # must reach the host byte for byte (a "{{" in an Apache comment must not
    # be evaluated). Errors in it surface with the file and line number from
    # `apachectl configtest` in the handler, before Apache is reloaded.
    - name: Install project vhost snippet
      ansible.builtin.copy:
        src: "{{ vhost_extra_src }}"
        dest: "{{ apache_extra_conf_path }}"
        owner: root
        group: root
        mode: "0640"
      when: vhost_extra_src is defined
      notify: Reload Apache

    # The vhost only includes the file when the project ships one, so a stale
    # copy would be dead config — but a dead copy of what was once live
    # directives is exactly what an operator would later misread.
    - name: Remove a previously installed vhost snippet the project no longer ships
      ansible.builtin.file:
        path: "{{ apache_extra_conf_path }}"
        state: absent
      when: vhost_extra_src is not defined
      notify: Reload Apache

    # Renders the ACME external account binding (a CA credential) when one is
    # configured, so the file must not be world-readable and must not be echoed
    # into the Ansible log.
    - name: Template Apache virtual host configuration
      ansible.builtin.template:
        src: "apache-vhost.conf.j2"
        dest: "{{ apache_conf_path }}"
        owner: root
        group: root
        mode: "0640"
      no_log: true
      notify: Reload Apache

    - name: Ensure required Apache modules are enabled
      community.general.apache2_module:
        name: "{{ item }}"
        state: present
      loop:
        - ssl
        - md
        - http2         # HTTP/2 for incoming client connections (Protocols h2)
        - proxy
        - proxy_http
        - proxy_http2   # Required: ProxyPass uses h2:// scheme to avoid ALPN mismatch.
                        # When mod_http2 is loaded and Protocols h2 is set, Apache
                        # advertises h2 in ALPN even for https:// proxy connections.
                        # Caddy then negotiates h2, but mod_proxy_http speaks HTTP/1.1
                        # only — causing the SSL handshake to fail. Using h2:// with
                        # mod_proxy_http2 resolves the protocol correctly end-to-end.
        - headers
        - proxy_wstunnel # For WebSocket support
        - rewrite       # Required: the :80 vhost redirects to HTTPS with a
                        # RewriteRule so the *requested* hostname is preserved.
                        # mod_alias Redirect cannot echo back %{HTTP_HOST}, so
                        # it would bounce every ServerAlias onto the fqdn.
      notify: Reload Apache

    - name: Enable Apache site
      ansible.builtin.file:
        src: "{{ apache_conf_path }}"
        dest: "{{ apache_enabled_path }}"
        state: link
      notify: Reload Apache
      when: not ansible_check_mode

    ###################################################################
    # Summary
    ###################################################################

    - name: Display host preparation summary
      ansible.builtin.debug:
        msg:
          - "Host preparation complete for {{ inventory_hostname }}"
          - "Deployment user: {{ deploy_user_name }} ({{ deploy_user_home }})"
          - "Lingering enabled for user {{ deploy_user_name }}"
          - "Loopback port: {{ host_loopback_port }} (Apache → 127.0.0.1:{{ host_loopback_port }})"
          - "Apache config: {{ apache_conf_path }}"
          - "Vhost snippet: {{ apache_extra_conf_path if vhost_extra_src is defined else 'none' }}"
          - "Podman: Installed"

  handlers:
    - name: Validate Apache configuration before reload
      ansible.builtin.command:
        cmd: apachectl configtest
      changed_when: false
      listen: Reload Apache

    - name: Reload Apache
      ansible.builtin.service:
        name: apache2
        state: reloaded
      listen: Reload Apache

    - name: Validate Apache configuration before restart
      ansible.builtin.command:
        cmd: apachectl configtest
      changed_when: false
      listen: Restart Apache

    - name: Restart Apache
      ansible.builtin.service:
        name: apache2
        state: restarted
      listen: Restart Apache
