# depp pins ANSIBLE_CONFIG to this file so Ansible does not auto-discover an
# ansible.cfg from the current working directory. depp is run from inside a
# project directory that may have been cloned from anywhere, and a config file
# there can set library, roles_path or callback plugins — that is, run
# arbitrary code on the control node.
#
# Deliberately near-empty: everything depp needs is either an Ansible default
# or set explicitly as an environment variable in ansible_common/runner.py.
[defaults]
nocows = 1
