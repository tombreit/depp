---
- name: Check depp target capabilities
  hosts: all
  gather_facts: false

  tasks:
    - name: Check Podman rootless runtime
      containers.podman.podman_system_info:
      register: podman_system
      changed_when: false

    - name: Require rootless Podman
      ansible.builtin.assert:
        that:
          - podman_system.podman_info.host.security.rootless | bool
        fail_msg: Podman is available but is not running rootless for this user.
        quiet: true

    - name: Check rsync
      ansible.builtin.command:
        cmd: rsync --version
      changed_when: false

    - name: Check user systemd manager
      ansible.builtin.command:
        cmd: systemctl --user show-environment
      changed_when: false