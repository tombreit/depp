---
- name: Check depp target capabilities
  hosts: all
  gather_facts: false

  tasks:
    - name: Check Podman rootless runtime
      containers.podman.podman_system_info:
      register: podman_system
      changed_when: false

    # containers.podman renamed the return key from podman_info to
    # podman_system_info (1.16+); the ansible package pins neither, so accept both.
    - name: Require rootless Podman
      ansible.builtin.assert:
        that:
          - (podman_system.podman_system_info | default(podman_system.podman_info)).host.security.rootless | bool
        fail_msg: Podman is available but is not running rootless for this user.
        quiet: true

    # These two probe whether a tool and the user systemd manager exist at
    # all. The synchronize and systemd_service modules use them, they cannot
    # test for them.
    - name: Check rsync  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: rsync --version
      changed_when: false

    - name: Check user systemd manager  # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl --user show-environment
      changed_when: false
